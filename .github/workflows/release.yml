name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, version, and changelog
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "${RELEASE_TAG}" == "v${version}" ]] || {
            echo "${RELEASE_TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no ${version} release entry" >&2
            exit 1
          }
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit}" == "${GITHUB_SHA}" ]] || {
            echo "release tag does not identify the workflow commit" >&2
            exit 1
          }

  package:
    name: Package (${{ matrix.platform }} ${{ matrix.architecture }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            archive_format: tar.gz
            binary_name: recoverable-delete
          - runner: macos-15
            platform: macos
            architecture: arm64
            archive_format: tar.gz
            binary_name: recoverable-delete
          - runner: windows-2025
            platform: windows
            architecture: x86_64
            archive_format: zip
            binary_name: recoverable-delete.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble Unix Plugin archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_output="$RUNNER_TEMP/release"
          archive="$release_output/recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}.${{ matrix.archive_format }}"
          RECOVERABLE_DELETE_BIN="$PWD/target/release/recoverable-delete" \
            sh scripts/package_plugin.sh "$RUNNER_TEMP/package"
          python3 scripts/build_release_artifact.py \
            --package-root "$RUNNER_TEMP/package/recoverable-delete" \
            --archive "$archive" \
            --expected-version "$version" \
            --binary-name "${{ matrix.binary_name }}"
          echo "RELEASE_OUTPUT=$release_output" >> "$GITHUB_ENV"

      - name: Assemble Windows Plugin archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $releaseOutput = "$env:RUNNER_TEMP\release"
          $archive = "$releaseOutput\recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}.${{ matrix.archive_format }}"
          $env:RECOVERABLE_DELETE_BIN = "$PWD\target\release\recoverable-delete.exe"
          ./scripts/package_plugin.ps1 -OutputRoot "$env:RUNNER_TEMP\package"
          python scripts/build_release_artifact.py `
            --package-root "$env:RUNNER_TEMP\package\recoverable-delete" `
            --archive "$archive" `
            --expected-version "$version" `
            --binary-name "${{ matrix.binary_name }}"
          "RELEASE_OUTPUT=$releaseOutput" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ env.RELEASE_OUTPUT }}/recoverable-delete-*
          if-no-files-found: error

  sbom:
    name: Generate CycloneDX SBOM
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and verify SBOM
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 install cargo-cyclonedx --version 0.5.9 --locked
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo +1.85.0 cyclonedx --format json --describe crate --target all --spec-version 1.5
          mkdir -p dist
          mv recoverable-delete.cdx.json "dist/recoverable-delete-${RELEASE_TAG}.cdx.json"
          jq -e --arg version "${RELEASE_TAG#v}" '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.5"
            and .metadata.component.name == "recoverable-delete"
            and .metadata.component.version == $version
            and (.components | length > 0)
          ' "dist/recoverable-delete-${RELEASE_TAG}.cdx.json" >/dev/null
          sha256sum "dist/recoverable-delete-${RELEASE_TAG}.cdx.json" \
            > "dist/recoverable-delete-${RELEASE_TAG}.cdx.json.sha256"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recoverable-delete-sbom
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest release archives and SBOM
    needs: [package, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release_artifacts/*.tar.gz
            release_artifacts/*.zip

      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            release_artifacts/*.tar.gz
            release_artifacts/*.zip
          sbom-path: release_artifacts/recoverable-delete-${{ env.RELEASE_TAG }}.cdx.json

  publish:
    name: Publish GitHub release
    needs: [package, sbom, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Combine SHA-256 checksums
        shell: bash
        run: cat release_artifacts/*.sha256 | sort > release_artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: Recoverable Delete ${{ env.RELEASE_TAG }}
          files: release_artifacts/*
          generate_release_notes: true
