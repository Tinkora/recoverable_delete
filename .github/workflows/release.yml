name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }} ${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            archive_format: tar.gz
            binary_name: recoverable-delete
          - runner: macos-15
            platform: macos
            architecture: arm64
            archive_format: tar.gz
            binary_name: recoverable-delete
          - runner: windows-2025
            platform: windows
            architecture: x86_64
            archive_format: zip
            binary_name: recoverable-delete.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble Unix Plugin archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_output="$RUNNER_TEMP/release"
          archive="$release_output/recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}.${{ matrix.archive_format }}"
          RECOVERABLE_DELETE_BIN="$PWD/target/release/recoverable-delete" \
            sh scripts/package_plugin.sh "$RUNNER_TEMP/package"
          python3 scripts/build_release_artifact.py \
            --package-root "$RUNNER_TEMP/package/recoverable-delete" \
            --archive "$archive" \
            --expected-version "$version" \
            --binary-name "${{ matrix.binary_name }}"
          echo "RELEASE_OUTPUT=$release_output" >> "$GITHUB_ENV"

      - name: Assemble Windows Plugin archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $releaseOutput = "$env:RUNNER_TEMP\release"
          $archive = "$releaseOutput\recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}.${{ matrix.archive_format }}"
          $env:RECOVERABLE_DELETE_BIN = "$PWD\target\release\recoverable-delete.exe"
          ./scripts/package_plugin.ps1 -OutputRoot "$env:RUNNER_TEMP\package"
          python scripts/build_release_artifact.py `
            --package-root "$env:RUNNER_TEMP\package\recoverable-delete" `
            --archive "$archive" `
            --expected-version "$version" `
            --binary-name "${{ matrix.binary_name }}"
          "RELEASE_OUTPUT=$releaseOutput" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ env.RELEASE_OUTPUT }}/recoverable-delete-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Combine SHA-256 checksums
        shell: bash
        run: cat release_artifacts/*.sha256 | sort > release_artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          generate_release_notes: true
