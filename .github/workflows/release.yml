name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, version, and changelog
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "${RELEASE_TAG}" == "v${version}" ]] || {
            echo "${RELEASE_TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no ${version} release entry" >&2
            exit 1
          }
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit}" == "${GITHUB_SHA}" ]] || {
            echo "release tag does not identify the workflow commit" >&2
            exit 1
          }

  package:
    name: Package (${{ matrix.platform }} ${{ matrix.architecture }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            archive_format: tar.gz
            binary_name: recoverable-delete
          - runner: macos-15
            platform: macos
            architecture: arm64
            archive_format: tar.gz
            binary_name: recoverable-delete
          - runner: windows-2025
            platform: windows
            architecture: x86_64
            archive_format: zip
            binary_name: recoverable-delete.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Install Rust on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble Unix Plugin archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_output="$RUNNER_TEMP/release"
          archive="$release_output/recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}.${{ matrix.archive_format }}"
          RECOVERABLE_DELETE_BIN="$PWD/target/release/recoverable-delete" \
            sh scripts/package_plugin.sh "$RUNNER_TEMP/package"
          python3 scripts/build_release_artifact.py \
            --package-root "$RUNNER_TEMP/package/recoverable-delete" \
            --archive "$archive" \
            --expected-version "$version" \
            --binary-name "${{ matrix.binary_name }}"
          echo "RELEASE_OUTPUT=$release_output" >> "$GITHUB_ENV"

      - name: Assemble Windows Plugin archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $releaseOutput = "$env:RUNNER_TEMP\release"
          $archive = "$releaseOutput\recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}.${{ matrix.archive_format }}"
          $env:RECOVERABLE_DELETE_BIN = "$PWD\target\release\recoverable-delete.exe"
          ./scripts/package_plugin.ps1 -OutputRoot "$env:RUNNER_TEMP\package"
          python scripts/build_release_artifact.py `
            --package-root "$env:RUNNER_TEMP\package\recoverable-delete" `
            --archive "$archive" `
            --expected-version "$version" `
            --binary-name "${{ matrix.binary_name }}"
          "RELEASE_OUTPUT=$releaseOutput" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recoverable-delete-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ env.RELEASE_OUTPUT }}/recoverable-delete-*
          if-no-files-found: error

  sbom:
    name: Generate CycloneDX SBOM
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and verify SBOM
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 install cargo-cyclonedx --version 0.5.9 --locked
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo +1.85.0 cyclonedx --format json --describe crate --target all --spec-version 1.5
          mkdir -p dist
          old_ref="$(jq -er '.metadata.component["bom-ref"]' recoverable-delete.cdx.json)"
          normalized_ref="pkg:cargo/recoverable-delete@${RELEASE_TAG#v}"
          serial_number="$(python3 -c \
            'import sys, uuid; print(f"urn:uuid:{uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[1])}")' \
            "https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}#${RELEASE_TAG}")"
          jq \
            --arg old_ref "${old_ref}" \
            --arg normalized_ref "${normalized_ref}" \
            --arg serial_number "${serial_number}" '
            .serialNumber = $serial_number
            | .metadata.component["bom-ref"] = $normalized_ref
            | .metadata.component.purl = $normalized_ref
            | .metadata.component.components |= map(
                (.purl | capture("#(?<path>.+)$").path) as $path
                | .["bom-ref"] = ($normalized_ref + "#" + $path)
                | .purl = ($normalized_ref + "#" + $path)
              )
            | .dependencies |= map(
                if .ref == $old_ref then .ref = $normalized_ref else . end
              )
          ' recoverable-delete.cdx.json > "dist/recoverable-delete-${RELEASE_TAG}.cdx.json"
          jq -e --arg version "${RELEASE_TAG#v}" '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.5"
            and .metadata.component.name == "recoverable-delete"
            and .metadata.component.version == $version
            and (.components | length > 0)
            and (.dependencies | length > 0)
          ' "dist/recoverable-delete-${RELEASE_TAG}.cdx.json" >/dev/null
          if grep -Eq 'path\+file:|download_url=file:' "dist/recoverable-delete-${RELEASE_TAG}.cdx.json"; then
            echo "SBOM contains a checkout-local package reference" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum "recoverable-delete-${RELEASE_TAG}.cdx.json" \
              > "recoverable-delete-${RELEASE_TAG}.cdx.json.sha256"
          )

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recoverable-delete-sbom
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest release archives and SBOM
    needs: [package, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release_artifacts/*.tar.gz
            release_artifacts/*.zip

      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            release_artifacts/*.tar.gz
            release_artifacts/*.zip
          sbom-path: release_artifacts/recoverable-delete-${{ env.RELEASE_TAG }}.cdx.json

  publish:
    name: Publish GitHub release
    needs: [package, sbom, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Combine SHA-256 checksums
        shell: bash
        run: cat release_artifacts/*.sha256 | sort > release_artifacts/SHA256SUMS.txt

      - name: Reverify tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" == "${GITHUB_SHA}" ]] || {
            echo "release tag changed during the workflow" >&2
            exit 1
          }
          (cd release_artifacts && sha256sum --check --strict -- ./*.sha256)
          mapfile -d '' assets < <(find release_artifacts -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          [[ "${#assets[@]}" == "12" ]] || {
            echo "unexpected release asset count" >&2
            exit 1
          }
          release_id="$(gh api \
            --method POST \
            "repos/${GH_REPO}/releases" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="Recoverable Delete ${RELEASE_TAG}" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true \
            --jq '.id')"
          release_json="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          test "$(jq -r '.tag_name' <<< "${release_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.draft' <<< "${release_json}")" = true
          gh release upload "${RELEASE_TAG}" "${assets[@]}"
          release_json="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          test "$(jq -r '.assets | length' <<< "${release_json}")" = 12
          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false \
            --jq '.draft' | grep -qx false
