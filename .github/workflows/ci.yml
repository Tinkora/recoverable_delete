name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Test release workflow contract
        run: ruby scripts/test_release_workflow.rb

      - name: Package Plugin on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/package_plugin.sh "$RUNNER_TEMP/package"

      - name: Build release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked

      - name: Verify packaged Plugin on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/verify_windows_plugin.ps1
          -PolicyBinary "$PWD\target\release\recoverable-delete.exe"
          -OutputRoot "$env:RUNNER_TEMP\package"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0

      - name: Install cargo-audit compatible with Rust 1.85
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit locked dependencies
        run: cargo audit
