name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Package Plugin on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/package_plugin.sh "$RUNNER_TEMP/package"

      - name: Build release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked

      - name: Verify packaged Plugin on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/verify_windows_plugin.ps1
          -PolicyBinary "$PWD\target\release\recoverable-delete.exe"
          -OutputRoot "$env:RUNNER_TEMP\package"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
